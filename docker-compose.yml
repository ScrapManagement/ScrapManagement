version: '3.8'

services:

  app:
    build:
        context: .
        dockerfile: Dockerfile
    container_name: scrap_app
    working_dir: /var/www
    volumes:
      - ./:/var/www
    depends_on:
      - db
    networks:
      - scrap_net

  db:
    image: mysql:8
    container_name: scrap_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: scrap_db
      MYSQL_USER: scrap
      MYSQL_PASSWORD: secret
    ports:
      - "3306:3306"
    networks:
      - scrap_net

  nginx:
    image: nginx:latest
    container_name: scrap_nginx
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - scrap_net

networks:
  scrap_net:
